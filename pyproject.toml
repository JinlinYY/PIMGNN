[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psmi"
version = "0.1.0"
description = "Physics-informed prediction of ternary liquid-liquid equilibria"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "PSMI Contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2.1,<3",
  "pandas>=2.3,<3",
  "scipy>=1.15,<2",
  "rdkit>=2025.3",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<1",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
baselines = ["imbalanced-learn>=0.13,<1"]
interactive = ["plotly>=5.24,<6"]
dev = ["pytest>=8,<9", "black>=24,<26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
